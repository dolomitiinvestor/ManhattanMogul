<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d2e">
  <title>Manhattan Mogul</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Mogul">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"></div>

  <aside id="side" class="hidden">
    <div class="side-head">
      <strong>Game log</strong>
      <button class="icon-btn" data-a="toggleLog" aria-label="Close log">✕</button>
    </div>
    <div id="log"></div>
    <form id="chat-form" autocomplete="off">
      <input id="chat-input" maxlength="200" placeholder="Say something…">
      <button type="submit">Send</button>
    </form>
  </aside>

  <div id="modal-root"></div>
  <div id="toasts"></div>
  <div id="conn" class="hidden">Reconnecting…</div>

  <script src="vendor/peerjs.min.js"></script>
  <script src="cards.js"></script>
  <script src="game.js"></script>
  <script src="app.js"></script>
  <script src="update.js"></script>
</body>
</html>
